# Builds the CRM and publishes it to Azure Static Web Apps.
#
# WHY A WORKFLOW RATHER THAN `swa deploy`. The CLI fetches its uploader from
# aka.ms at run time, and the environment this was set up from cannot reach
# it. GitHub's runners can, and this has the better property anyway: every
# push to the branch redeploys, so the site and the repository cannot drift.
#
# THE THREE SWITCHES ARE SET HERE, and they are the whole cutover:
#   VITE_API_BASE=/api       sends queries to the Function App, not Supabase
#   VITE_BLOB_STORAGE=on     sends attachments to Azure Blob Storage
#   VITE_AUTH=entra (in .env.production) signs in with Microsoft Entra ID
#   Nothing here points at Supabase or Netlify any more.
#
# VITE_SUPABASE_ANON_KEY is the `anon` key, which is public by design: it
# carries no privileges of its own and every row-level policy still applies
# to it. The service_role key must NEVER appear here — a VITE_ variable is
# compiled into the bundle and served to every visitor.
name: deploy the CRM to Azure

on:
  push:
    branches: [ claude/crm-redesign-preview ]
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install
        run: npm ci || npm install

      - name: build, pointed at Azure
        env:
          VITE_API_BASE: /api
          VITE_BLOB_STORAGE: on
        run: npm run build

      - name: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          
  # THE SERVER AND THE DATABASE, on the same push as the website.
  # Before this, a push updated only the website; the API and the database
  # had to be updated by hand from Cloud Shell, and the day they were not,
  # the website called a server function that did not exist yet and nobody
  # could sign in. Now all three move together.
  #
  # Signs in to Azure with a federated credential (infra/github-deploy-access.sh):
  # no password or key is stored anywhere. These ids are not secrets.
  api_and_database:
    runs-on: ubuntu-latest
    name: deploy the API and database changes
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: "e11daa33-1f77-49db-b9c7-8f468d55f705"
      AZURE_TENANT_ID: "1d063589-6565-42de-8055-92aca1128f35"
      AZURE_SUBSCRIPTION_ID: "488bfe98-ea81-424c-8bc8-d97369a44759"
      RG: techzoid-crm
      FA: techzoid-fn-web7gna6q5rns
    steps:
      - uses: actions/checkout@v4

      - name: is deploy access set up?
        id: access
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT";
          else echo "::warning::API not deployed: run infra/github-deploy-access.sh once and add its ids here."; fi

      - uses: actions/setup-node@v4
        if: steps.access.outputs.ready == 'yes'
        with:
          node-version: '22'

      - name: test the API
        if: steps.access.outputs.ready == 'yes'
        run: npm ci && (cd api && npm ci) && npx vitest run api/ netlify/

      - uses: azure/login@v2
        if: steps.access.outputs.ready == 'yes'
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: apply database changes
        if: steps.access.outputs.ready == 'yes'
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          KV="$(az keyvault list -g "$RG" --query "[0].name" -o tsv)"
          DB="$(az keyvault secret show --vault-name "$KV" -n pg-connection-string --query value -o tsv)"
          echo "::add-mask::$DB"
          DB="$DB" bash infra/migrate.sh

      - name: deploy the API
        if: steps.access.outputs.ready == 'yes'
        run: |
          bash infra/package-api.sh "$RUNNER_TEMP/api.zip"
          az functionapp deployment source config-zip -g "$RG" -n "$FA" --src "$RUNNER_TEMP/api.zip" -o none

      - name: check the new API is the one answering
        if: steps.access.outputs.ready == 'yes'
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 20
            body=$(curl -s -w ' %{http_code}' -X POST https://crm.ttpldelhi.com/api/rpc -H 'content-type: application/json' -d '{"fn":"my_profile","args":{}}')
            echo "rpc answered: $body"
            case "$body" in *"Unknown function"*|*" 5"[0-9][0-9]) ;; *) exit 0 ;; esac
          done
          echo "::error::the API did not pick up the new version"; exit 1
