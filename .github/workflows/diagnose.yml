# Read-only health check of the API's configuration. Prints no secret
# values: only whether each exists, its length, and whether it has the
# expected shape. Triggered by touching .github/diagnose-request.
name: diagnose the API

on:
  workflow_dispatch:
  push:
    branches: [ claude/crm-redesign-preview ]
    paths: [ ".github/diagnose-request" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RG: techzoid-crm
      FA: techzoid-fn-web7gna6q5rns
      KV: techzoidkvweb7gna6q5rns
      SUB: 488bfe98-ea81-424c-8bc8-d97369a44759
    steps:
      - uses: azure/login@v2
        with:
          client-id: e11daa33-1f77-49db-b9c7-8f468d55f705
          tenant-id: 1d063589-6565-42de-8055-92aca1128f35
          subscription-id: 488bfe98-ea81-424c-8bc8-d97369a44759
      - name: key vault references resolve?
        run: |
          az rest --method get --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Web/sites/$FA/config/configreferences/appsettings?api-version=2022-03-01" \
            --query "value[].{n:name,s:properties.status,d:properties.details}" -o tsv | while IFS=$'\t' read -r n s d; do echo "::warning title=ref::$n = $s ${d:0:200}"; done
      - name: secrets present and shaped right (values never printed)
        run: |
          for s in interakt-api-key anthropic-api-key resend-api-key ms-client-secret; do
            v="$(az keyvault secret show --vault-name "$KV" -n "$s" --query value -o tsv 2>/dev/null || true)"
            if [ -z "$v" ]; then echo "::warning title=secret::$s MISSING"; continue; fi
            shape=""; case "$s" in anthropic-api-key) [[ "$v" == sk-ant-* ]] && shape="looks like an Anthropic key" || shape="NOT an Anthropic key (no sk-ant- prefix)";; esac
            echo "::warning title=secret::$s present, ${#v} chars ${shape}"
          done
          for k in INTERAKT_API_KEY ANTHROPIC_API_KEY; do
            v="$(az functionapp config appsettings list -g "$RG" -n "$FA" --query "[?name=='$k'].value|[0]" -o tsv)"
            echo "::warning title=setting::$k ${v:+set (${v:0:22}…)}${v:-NOT SET}"
          done
      - name: shared mailboxes and reminder settings
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          DB="$(az keyvault secret show --vault-name "$KV" -n pg-connection-string --query value -o tsv)"; echo "::add-mask::$DB"
          psql "$DB" -tA -c "select 'mailbox: '||email||' provider='||coalesce(provider,'?')||' connected='||(refresh_token is not null) from email_accounts order by email" 2>&1 | while read -r l; do echo "::warning title=db::$l"; done
          psql "$DB" -tA -c "select 'settings keys: '||string_agg(k, ', ') from (select jsonb_object_keys(data) k from settings) x where k ilike '%remind%' or k ilike '%payment%' or k ilike '%whatsapp%'" 2>&1 | while read -r l; do echo "::warning title=db::$l"; done
