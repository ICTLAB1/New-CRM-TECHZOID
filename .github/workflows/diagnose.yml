# Reads the server's recent errors from Application Insights and prints
# them as annotations, so a failure can be diagnosed without anyone opening
# the Azure portal. Run by hand (workflow_dispatch); changes nothing.
name: diagnose the API

on:
  workflow_dispatch:
  push:
    branches: [ claude/crm-redesign-preview ]
    paths: [ ".github/diagnose-request" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: e11daa33-1f77-49db-b9c7-8f468d55f705
          tenant-id: 1d063589-6565-42de-8055-92aca1128f35
          subscription-id: 488bfe98-ea81-424c-8bc8-d97369a44759
      - name: recent server errors
        run: |
          az extension add -n application-insights -y >/dev/null 2>&1 || true
          AI="$(az monitor app-insights component show -g techzoid-crm --query "[0].appId" -o tsv)"
          q() { az monitor app-insights query --app "$AI" --analytics-query "$1" --query "tables[0].rows" -o tsv 2>&1 | head -40; }
          echo "== requests =="; q "requests | where timestamp > ago(3h) | summarize n=count(), fails=countif(success==false), codes=make_set(resultCode) by name | order by n desc | take 30" | while IFS= read -r l; do echo "::warning title=req::${l:0:900}"; done
          echo "== admin =="; q "requests | where timestamp > ago(3h) and name has 'admin' | order by timestamp desc | project timestamp, name, resultCode, duration, operation_Id | take 10" | while IFS= read -r l; do echo "::warning title=admin::${l:0:900}"; done
          echo "== traces for admin ops =="; q "let ops = requests | where timestamp > ago(3h) and name has 'admin' | project operation_Id; traces | where operation_Id in (ops) | order by timestamp desc | project timestamp, severityLevel, message | take 25" | while IFS= read -r l; do echo "::warning title=trace::${l:0:900}"; done
          echo "== exceptions for admin ops =="; q "let ops = requests | where timestamp > ago(3h) and name has 'admin' | project operation_Id; exceptions | where operation_Id in (ops) | project timestamp, outerMessage, details | take 10" | while IFS= read -r l; do echo "::warning title=exc::${l:0:900}"; done
      - name: which functions are registered, and does admin-users answer
        run: |
          az functionapp function list -g techzoid-crm -n techzoid-fn-web7gna6q5rns --query "[].name" -o tsv | sed 's#.*/##' | tr '\n' ' ' | sed 's/^/::warning title=functions::/'; echo
          for u in https://crm.ttpldelhi.com/api/team-accounts https://crm.ttpldelhi.com/api/admin-users https://crm.ttpldelhi.com/api/followups-admin; do
            r=$(curl -s -m 30 -o /tmp/b -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"action":"delete_user"}' "$u"); echo "::warning title=probe::$u -> $r $(head -c 300 /tmp/b)"
          done

