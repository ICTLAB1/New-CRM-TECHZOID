[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Automatic quotation follow-ups. 04:00 UTC is 09:30 in India — a chaser
# should land at the start of a working day, not overnight.
#
# Declared here as well as in the function file: the schedule is the whole
# feature, and a scheduled function that silently is not scheduled looks
# exactly like one that has nothing to send.
[functions."followups-run"]
  schedule = "0 4 * * *"

# The campaign sender. Every two minutes, because the pacing lives in the
# rules rather than in how often this runs: sendWindow works out how many
# messages the elapsed time has earned at the campaign's own gap, so running
# often makes a campaign responsive without making it faster. Fifteen minutes
# was the first version and it was wrong in a way nobody would have called a
# bug — the first message of a campaign was up to a quarter of an hour behind
# the person who pressed Launch, which reads as broken.
#
# A launch now also drains a couple of messages itself, so the first one
# leaves in seconds. This carries the rest across the hours that follow, and
# most runs correctly send nothing: outside sending hours, at the weekend,
# once the cap is spent, or because not enough time has passed.
#
# Declared here as well as in the function file: the schedule is the whole
# feature, and a scheduled function that silently is not scheduled looks
# exactly like a campaign with nothing left to send.
[functions."outreach-run"]
  schedule = "*/2 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
