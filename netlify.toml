[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Automatic quotation follow-ups. 04:00 UTC is 09:30 in India — a chaser
# should land at the start of a working day, not overnight.
#
# Declared here as well as in the function file: the schedule is the whole
# feature, and a scheduled function that silently is not scheduled looks
# exactly like one that has nothing to send.
[functions."followups-run"]
  schedule = "0 4 * * *"

# The campaign sender. Every 15 minutes, not because a campaign is urgent but
# because the throttle is enforced per run: 90 seconds between messages means
# a run that could send twenty spends most of its time waiting, so it sends
# what it may and comes back. The function itself decides whether the moment
# is inside the campaign's own sending window — most runs correctly send
# nothing, including every run overnight and at the weekend.
#
# Declared here as well as in the function file: the schedule is the whole
# feature, and a scheduled function that silently is not scheduled looks
# exactly like a campaign with nothing left to send.
[functions."outreach-run"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
